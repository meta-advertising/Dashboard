<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body House — Portail Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --coral: #F19D76;
            --coral-light: #f5b99a;
            --coral-soft: rgba(241,157,118,0.10);
            --coral-softer: rgba(241,157,118,0.05);
            --beige: #f1dbcf;
            --beige-light: #f8ede7;
            --dark: #242424;
            --dark-soft: #3a3a3a;
            --bg: #faf8f6;
            --bg-card: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #6b6b6b;
            --text-tertiary: #9a9a9a;
            --border: rgba(0,0,0,0.06);
            --border-hover: rgba(241,157,118,0.3);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
            --shadow-coral: 0 4px 20px rgba(241,157,118,0.15);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --meta-blue: #1877f2;
            --meta-soft: rgba(24,119,242,0.08);
            --google-blue: #4285f4;
            --google-soft: rgba(66,133,244,0.08);
            --gmb-green: #34a853;
            --gmb-soft: rgba(52,168,83,0.08);
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* HEADER */
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .logo-bh {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--coral) 0%, #e8845a 100%);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: -0.5px;
            box-shadow: 0 2px 8px rgba(241,157,118,0.3);
        }
        .logo-text { display: flex; flex-direction: column; }
        .logo-text-main { font-size: 17px; font-weight: 800; color: var(--dark); letter-spacing: -0.3px; }
        .logo-text-sub { font-size: 11px; font-weight: 500; color: var(--text-secondary); margin-top: -1px; }

        .year-toggle {
            display: flex;
            background: var(--bg);
            border-radius: 10px;
            padding: 3px;
            gap: 2px;
            border: 1px solid var(--border);
        }
        .year-btn {
            padding: 7px 18px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            background: transparent;
            color: var(--text-secondary);
        }
        .year-btn.active {
            background: var(--coral);
            color: #fff;
            box-shadow: 0 2px 8px rgba(241,157,118,0.3);
        }
        .year-btn:hover:not(.active) { background: var(--coral-soft); color: var(--coral); }

        /* MAIN */
        .main { max-width: 1400px; margin: 0 auto; padding: 28px 32px 60px; }

        /* KPI ROW */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px 22px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .kpi-card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-coral);
            transform: translateY(-2px);
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            border-radius: 3px 3px 0 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .kpi-card:hover::before { opacity: 1; }
        .kpi-card.kpi-imp::before { background: var(--meta-blue); }
        .kpi-card.kpi-clics::before { background: var(--coral); }
        .kpi-card.kpi-dep::before { background: #ef6c00; }
        .kpi-card.kpi-ca::before { background: var(--gmb-green); }

        .kpi-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .kpi-icon {
            width: 36px; height: 36px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
        }
        .kpi-icon svg { width: 18px; height: 18px; }
        .kpi-icon.ico-imp { background: var(--meta-soft); color: var(--meta-blue); }
        .kpi-icon.ico-clics { background: var(--coral-soft); color: var(--coral); }
        .kpi-icon.ico-dep { background: rgba(239,108,0,0.08); color: #ef6c00; }
        .kpi-icon.ico-ca { background: var(--gmb-soft); color: var(--gmb-green); }
        .kpi-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .kpi-value { font-size: 26px; font-weight: 800; color: var(--dark); letter-spacing: -0.5px; }
        .kpi-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; font-weight: 500; }

        /* SECTION TITLE */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title .count {
            background: var(--coral-soft);
            color: var(--coral);
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
        }

        /* BOUTIQUES GRID */
        .boutiques-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
            align-items: start;
        }

        .boutique-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 22px;
            transition: all 0.3s ease;
        }
        .boutique-card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .boutique-card.inactive {
            opacity: 0.5;
            pointer-events: none;
        }
        .boutique-card.inactive .card-header::after {
            content: 'Pas de campagne active';
            font-size: 10px;
            background: rgba(0,0,0,0.06);
            color: var(--text-tertiary);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            gap: 8px;
        }
        .card-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--dark);
        }
        .card-ca {
            font-size: 16px;
            font-weight: 800;
            color: var(--gmb-green);
        }
        .card-ca-label {
            font-size: 9px;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: right;
        }

        /* METRICS SECTIONS */
        .metrics-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .metrics-section {
            background: var(--bg);
            border-radius: var(--radius-md);
            padding: 12px 14px;
        }
        .metrics-section-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .metrics-section-title .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-meta { background: var(--meta-blue); }
        .dot-google { background: var(--google-blue); }
        .dot-gmb { background: var(--gmb-green); }
        .ms-meta .metrics-section-title { color: var(--meta-blue); }
        .ms-google .metrics-section-title { color: var(--google-blue); }
        .ms-gmb .metrics-section-title { color: var(--gmb-green); }

        .metrics-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px 12px;
        }
        .metrics-row.cols-3 {
            grid-template-columns: repeat(3, 1fr);
        }
        .metric {
            display: flex;
            flex-direction: column;
        }
        .metric-val {
            font-size: 14px;
            font-weight: 700;
            color: var(--dark);
        }
        .metric-label {
            font-size: 10px;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        /* Budget bar */
        .budget-bar-wrap { margin-top: 6px; }
        .budget-bar-info {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-tertiary);
            margin-bottom: 3px;
            font-weight: 500;
        }
        .budget-bar {
            height: 4px;
            background: rgba(0,0,0,0.06);
            border-radius: 4px;
            overflow: hidden;
        }
        .budget-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        .fill-ok { background: var(--gmb-green); }
        .fill-warn { background: #ef6c00; }
        .fill-over { background: #c62828; }

        /* RAPPORTS SECTION */
        .rapports-section {
            margin-top: 16px;
        }
        .rapports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }
        .rapport-subsection {
            margin-bottom: 24px;
        }
        .rapport-subsection-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--dark-soft);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--beige);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .rapport-subsection-title svg { width: 16px; height: 16px; color: var(--coral); }

        .rapport-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }
        .rapport-link:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-sm);
            transform: translateY(-1px);
        }
        .rapport-icon {
            width: 34px; height: 34px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .rapport-icon.ri-synth { background: var(--coral-soft); color: var(--coral); }
        .rapport-icon.ri-skeepers { background: rgba(124,58,237,0.08); color: #7c3aed; }
        .rapport-icon svg { width: 16px; height: 16px; }
        .rapport-label { font-size: 13px; font-weight: 600; }
        .rapport-year { font-size: 11px; color: var(--text-tertiary); font-weight: 500; }

        /* Site web section in cards */
        .card-footer {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-footer-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card-footer-val { font-size: 13px; font-weight: 700; color: var(--dark); }
        .card-footer-label { font-size: 9px; color: var(--text-tertiary); font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; }

        /* RESPONSIVE */
        @media (max-width: 1100px) {
            .kpi-row { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .header { padding: 0 16px; height: 60px; }
            .main { padding: 20px 16px 40px; }
            .kpi-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .kpi-value { font-size: 20px; }
            .boutiques-grid { grid-template-columns: 1fr; }
            .rapports-grid { grid-template-columns: 1fr; }
            .logo-text-main { font-size: 15px; }
        }
        @media (max-width: 480px) {
            .kpi-row { grid-template-columns: 1fr 1fr; gap: 8px; }
            .kpi-card { padding: 14px 16px; }

        }

            "Salaise": { meta_imp: 681303, meta_clics: 4416, meta_eng: 1535, meta_dep: 1699, meta_budget: 11200, google_imp: 12732, google_clics: 2391, google_dep: 870, gmb_imp: 11609, appels: 63, itineraires: 306, visites: 3780, ca_ttc: 51864 },

    };

    const RAPPORTS_SYNTH = [
        { label: 'Aubiere', file: 'synthese-bodyhouse-aubiere-2025.pdf' },
        { label: 'Avignon Nord', file: 'synthese-bodyhouse-avignon-nord-2025.pdf' },
        { label: 'Avignon Sud', file: 'synthese-bodyhouse-avignon-sud-2025.pdf' },
        { label: 'Biganos', file: 'synthese-bodyhouse-biganos-2025.pdf' },
        { label: 'Chambery', file: 'synthese-bodyhouse-chambery-2025.pdf' },
        { label: 'Grenoble', file: 'synthese-bodyhouse-grenoble-2025.pdf' },
        { label: 'Jacou', file: 'synthese-bodyhouse-jacou-2025.pdf' },
        { label: 'Lyon', file: 'synthese-bodyhouse-lyon-2025.pdf' },
        { label: 'Montelimar', file: 'synthese-bodyhouse-montelimar-2025.pdf' },
        { label: 'Sainte-Eulalie', file: 'synthese-bodyhouse-sainte-eulalie-2025.pdf' },
        { label: 'Salaise', file: 'synthese-bodyhouse-salaise-2025.pdf' },
        { label: 'Valence', file: 'synthese-bodyhouse-valence-2025.pdf' },
        { label: 'Villefranche', file: 'synthese-bodyhouse-villefranche-2025.pdf' }
    ];

    let currentYear = '2025';

    // ========= HELPERS =========
    function fmt(n) {
        if (n == null || isNaN(n)) return '0';
        return n.toLocaleString('fr-FR');
    }
    function fmtEuro(n) {
        if (n == null || isNaN(n)) return '0 €';
        return n.toLocaleString('fr-FR') + ' €';
    }
    function fmtShort(n) {
        if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.', ',') + 'M';
        if (n >= 1000) return (n / 1000).toFixed(0) + 'K';
        return n.toString();
    }

    // ========= KPI =========
    function renderKPIs() {
        const year = DATA[currentYear];
        let totalImp = 0, totalClics = 0, totalDep = 0, totalCA = 0;
        Object.values(year).forEach(b => {
            totalImp += b.meta_imp;
            totalClics += b.meta_clics;
            totalDep += b.meta_dep;
            totalCA += b.ca_ttc;
        });

        document.getElementById('kpiRow').innerHTML = `
            <div class="kpi-card kpi-imp">
                <div class="kpi-header">
                    <div class="kpi-icon ico-imp">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </div>
                    <span class="kpi-label">Impressions META</span>
                </div>
                <div class="kpi-value">${fmtShort(totalImp)}</div>
                <div class="kpi-sub">${fmt(totalImp)} impressions totales</div>
            </div>
            <div class="kpi-card kpi-clics">
                <div class="kpi-header">
                    <div class="kpi-icon ico-clics">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5"/></svg>
                    </div>
                    <span class="kpi-label">Clics META</span>
                </div>
                <div class="kpi-value">${fmtShort(totalClics)}</div>
                <div class="kpi-sub">${fmt(totalClics)} clics totaux</div>
            </div>
            <div class="kpi-card kpi-dep">
                <div class="kpi-header">
                    <div class="kpi-icon ico-dep">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    </div>
                    <span class="kpi-label">Depenses META</span>
                </div>
                <div class="kpi-value">${fmtEuro(totalDep)}</div>
                <div class="kpi-sub">Budget total investi</div>
            </div>
            <div class="kpi-card kpi-ca">
                <div class="kpi-header">
                    <div class="kpi-icon ico-ca">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                    </div>
                    <span class="kpi-label">CA TTC</span>
                </div>
                <div class="kpi-value">${fmtEuro(totalCA)}</div>
                <div class="kpi-sub">Chiffre d'affaires toutes boutiques</div>
            </div>
        `;
    }

    // ========= BOUTIQUES =========
    function renderBoutiques() {
        const year = DATA[currentYear];
        const grid = document.getElementById('boutiquesGrid');
        const sorted = Object.entries(year).sort((a, b) => b[1].ca_ttc - a[1].ca_ttc);

        let activeCount = 0;
        grid.innerHTML = sorted.map(([name, d]) => {
            const isInactive = d.meta_imp === 0 && d.google_imp === 0 && d.ca_ttc === 0;
            if (!isInactive) activeCount++;
            const budgetPct = d.meta_budget > 0 ? Math.min((d.meta_dep / d.meta_budget) * 100, 120) : 0;
            const fillClass = budgetPct > 105 ? 'fill-over' : budgetPct > 90 ? 'fill-warn' : 'fill-ok';

            return `
            <div class="boutique-card ${isInactive ? 'inactive' : ''}">
                <div class="card-header">
                    <div class="card-name">${name}</div>
                    <div style="text-align:right">
                        <div class="card-ca">${fmtEuro(d.ca_ttc)}</div>
                        <div class="card-ca-label">CA TTC</div>
                    </div>
                </div>
                <div class="metrics-group">
                    <div class="metrics-section ms-meta">
                        <div class="metrics-section-title"><span class="dot dot-meta"></span> META</div>
                        <div class="metrics-row">
                            <div class="metric"><div class="metric-val">${fmt(d.meta_imp)}</div><div class="metric-label">Impressions</div></div>
                            <div class="metric"><div class="metric-val">${fmt(d.meta_clics)}</div><div class="metric-label">Clics</div></div>
                            <div class="metric"><div class="metric-val">${fmtEuro(d.meta_dep)}</div><div class="metric-label">Depenses</div></div>
                            <div class="metric"><div class="metric-val">${fmt(d.meta_eng)}</div><div class="metric-label">Engagements</div></div>
                        </div>
                        ${d.meta_budget > 0 ? `
                        <div class="budget-bar-wrap">
                            <div class="budget-bar-info">
                                <span>Budget: ${fmtEuro(d.meta_budget)}</span>
                                <span>${Math.round(budgetPct)}% consomme</span>
                            </div>
                            <div class="budget-bar"><div class="budget-bar-fill ${fillClass}" style="width:${Math.min(budgetPct, 100)}%"></div></div>
                        </div>` : ''}
                    </div>
                    <div class="metrics-section ms-google">
                        <div class="metrics-section-title"><span class="dot dot-google"></span> GOOGLE ADS</div>
                        <div class="metrics-row cols-3">
                            <div class="metric"><div class="metric-val">${fmt(d.google_imp)}</div><div class="metric-label">Impressions</div></div>
                            <div class="metric"><div class="metric-val">${fmt(d.google_clics)}</div><div class="metric-label">Clics</div></div>
                            <div class="metric"><div class="metric-val">${fmtEuro(d.google_dep)}</div><div class="metric-label">Depenses</div></div>
                        </div>
                    </div>
                    <div class="metrics-section ms-gmb">
                        <div class="metrics-section-title"><span class="dot dot-gmb"></span> GOOGLE MY BUSINESS</div>
                        <div class="metrics-row cols-3">
                            <div class="metric"><div class="metric-val">${fmt(d.gmb_imp)}</div><div class="metric-label">Impressions</div></div>
                            <div class="metric"><div class="metric-val">${fmt(d.appels)}</div><div class="metric-label">Appels</div></div>
                            <div class="metric"><div class="metric-val">${fmt(d.itineraires)}</div><div class="metric-label">Itineraires</div></div>
                        </div>
                    </div>
                </div>
                <div class="card-footer">
                    <div class="card-footer-item">
                        <div class="card-footer-val">${fmt(d.visites)}</div>
                        <div class="card-footer-label">Visites site web</div>
                    </div>
                </div>
            </div>`;
        }).join('');

        document.getElementById('boutiqueCount').textContent = activeCount;
    }

    // ========= RAPPORTS =========
    function renderRapports() {
        document.getElementById('rapportsSynthGrid').innerHTML = RAPPORTS_SYNTH.map(r => `
            <a class="rapport-link" href="${r.file}" target="_blank">
                <div class="rapport-icon ri-synth">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                </div>
                <div>
                    <div class="rapport-label">${r.label}</div>
                    <div class="rapport-year">Synthese 2025</div>
                </div>
            </a>
        `).join('');

        document.getElementById('rapportsSkeepersGrid').innerHTML = `
            <a class="rapport-link" href="rapport-skeepers-bodyhouse-2025.pdf" target="_blank">
                <div class="rapport-icon ri-skeepers">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                </div>
                <div>
                    <div class="rapport-label">Rapport Performance Skeepers</div>
                    <div class="rapport-year">Octobre — Decembre 2025</div>
                </div>
            </a>
        `;
    }

    // ========= YEAR SWITCH =========
    function switchYear(year) {
        currentYear = year;
        document.querySelectorAll('.year-btn').forEach(btn => {
            btn.classList.toggle('active', btn.textContent === year);
        });
        renderKPIs();
        renderBoutiques();
    }

    // ========= INIT =========
    renderKPIs();
    renderBoutiques();
    renderRapports();
    </script>
